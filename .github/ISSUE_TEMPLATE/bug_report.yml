name: Bug report
description: Something in Scissor doesn't work the way it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
  - type: textarea
    id: files
    attributes:
      label: Screenshots or files
      description: Drag in a screenshot, or a small .cut file (zip it first) that shows the problem.
  - type: input
    id: version
    attributes:
      label: Scissor version
      description: Shown in Help ▸ About Scissor.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Browser and system
      render: text
